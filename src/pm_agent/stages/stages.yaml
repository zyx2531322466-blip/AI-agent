# 顶层 key 就是命令里用的名字，例如 pm-agent stage specify。

specify:
  title: "规范"
  purpose: "把一段模糊想法整理成可评审的规范，这一步不涉及任何代码相关的内容。之所以必须有这一步：后面的任务拆解、进度判断、变更影响分析都以规范为依据，跳过它等于让后面每一步都靠猜。"
  inputs: "使用者的一句话目标；项目现有的 project.yaml（名称、目标、学习目标）。如果没有提供清晰的输入，则询问他们想要构建什么"
  outputs: "spec.md 里的需求条目：目标、范围（明确列出包含的功能和不包含的功能）、待澄清问题清单、使用者、成功标准"
  basis: "FR-002、FR-004、FR-047；提示词在 prompts/specify.system.md 与 prompts/specify.user.md"
  tradeoffs: "提示词做成数据文件、而不是写死在代码里：改文案不用碰代码，提示词本身也能被人评审；代价是多一层加载，还要在 pyproject 里登记 package-data——漏了那行，可编辑安装照样能跑，正式安装就丢文件。"
  alternatives: "也考虑过让模型直接产出结构化数据（JSON）再渲染成文档。放弃了：规范首先是给人评审的文档，先出 JSON 会让提示词变复杂，格式校验失败时也更难解释。现在改成先出文档、再用关键词校验。"

plan:
  title: "计划"
  purpose: "为spec.md 里的需求条目选定技术栈，把规范翻译成可执行的实现方案"
  inputs: "spec.md 里的需求条目：目标、范围（明确列出包含的功能和不包含的功能）、待澄清问题清单。"
  outputs: "plan.md 里的计划章节：设计原则、技术选型、目录结构、关键机制、里程碑、风险、与规范的偏差记录；对每条需求说明打算怎么做。"
  basis: "plan.md 的章节结构：设计原则 / 技术选型 / 目录结构 / 关键机制 / 里程碑 / 风险 / 与规范的偏差记录"
  tradeoffs: "计划与规范分成两份文档：规范只回答做什么与为什么，计划才谈技术选型与取舍。代价是同一件事要在两处各说一次，所以计划里只引用需求条目编号，不复制正文。"
  alternatives: "也考虑过把计划并进规范、一份文档写到底。放弃了：一旦混在一起，范围变了和实现方式变了就分不清，而这两件事的评审人往往不是同一个。"

tasks:
  title: "任务"
  purpose: "将plan.md中的需求依据技术栈拆解成可完成的任务，明确每个任务的验收标准和优先级"
  inputs: "plan.md里的任务条目：包含spec.md中每条需求的全部内容以及选定的技术栈"
  outputs: "tasks.md中任务条目：任务点实现的功能（明确列出实现的功能与不实现的功能）、验收标准、优先级、依赖(依赖的其他 Requirement 或 Spec)、追溯"
  basis: "FR-008 ~ FR-014；行格式见 prompts/tasks.system.md 与 workspace/format.py 的解析规则"
  tradeoffs: "任务清单用 Markdown 行内字段（**完成标准**：…**优先级**：…）而不是独立的数据文件：人能直接读、能手工改；代价是解析要更小心——编号位数、末尾那个句号、[P] 标记，这几处都真踩过坑。"
  alternatives: "也考虑过把任务存成 YAML。放弃了：这份清单是给人看的，YAML 里塞长句可读性反而更差；行内字段牺牲一点解析的简单，换来打开就能改。"

track:
  title: "跟踪"
  purpose: "根据上一轮会话的交接记录和本轮会话的实际情况，更新任务清单的状态，并生成新的交接记录。"
  inputs: "上一轮的交接记录（sessions/ 里最新的那份）；任务清单的当前状态；本次会话实际做了什么（通常只有一两句话）；使用者给出的确认或补充。"
  outputs: "更新后的任务状态与变更时间；一份新的交接记录，落到 sessions/，至少含三要素——当前状态、下一步建议、未决问题；其中目标与决策只写引用（需求条目编号、decisions/ 文件名），不复制正文。"
  basis: "FR-015 ~ FR-020；记录格式见 sessions/ 下既有记录与 workspace/handoff.py"
  tradeoffs: "交接记录只写引用、不复制正文：目标写需求条目编号，决策写文件名。代价是读的人要多跳一次；收益是同一件事只有一份权威版本，不会两边漂移。"
  alternatives: "也考虑过把整份规范复制进交接记录，让下一次会话一眼看全。放弃了：复制的那一刻就产生了第二份事实，而两份必然漂移——那正是重启后目标漂移的成因。"
