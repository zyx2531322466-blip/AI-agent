[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-agent"
version = "0.1.0"
description = "项目管理 Agent —— 规范驱动的本地项目管理助手"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pm-agent = "pm_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pm_agent.templates" = ["*.yaml", "*.md"]
"pm_agent.stages" = ["*.yaml"]
"pm_agent.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: 需要联网并真实调用模型的测试（默认跳过，见 tests/test_specify_live.py）",
]
